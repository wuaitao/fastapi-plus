name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.13"
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync pyright
      - name: Pytest（允许模板尚无测试）
        shell: python
        run: |
          import subprocess
          import sys

          # 仅把未收集到测试视为模板空目录；真实失败、收集错误和中断继续阻断 CI。
          result = subprocess.run(["uv", "run", "--no-sync", "pytest"], check=False)
          if result.returncode == 5:
              print("::notice::尚无业务测试，本步骤未验证任何测试用例。")
              sys.exit(0)
          sys.exit(result.returncode)
