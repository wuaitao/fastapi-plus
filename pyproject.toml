[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "fastapi-plus"
version = "0.1.0.dev0"
description = "A lightweight, production-oriented FastAPI backend starter"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "aiosqlite>=0.21,<1",
    "alembic>=1.16,<2",
    "argon2-cffi>=25.1,<26",
    "email-validator>=2.2,<3",
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "pyjwt>=2.10.1,<3",
    "python-multipart>=0.0.22,<0.1",
    "sqlalchemy[asyncio]>=2.0.41,<2.1",
    # 使用原生流式请求体限额，最低版本包含该中间件。
    "starlette>=1.6,<2",
    "structlog>=25.5,<27",
    "typer>=0.21,<1",
    "uvicorn>=0.34,<1",
]

[project.scripts]
fastplus = "app.cli.main:app"

[project.optional-dependencies]
postgresql = ["asyncpg>=0.30,<1"]
mysql = ["asyncmy>=0.2.10,<0.3"]
oss = ["alibabacloud-oss-v2>=1.2,<2"]
cos = ["cos-python-sdk-v5>=1.9.38,<2"]
redis = ["redis>=5.2,<8"]
celery = ["celery[redis]>=5.5,<6"]
metrics = ["prometheus-client>=0.24,<1"]

[dependency-groups]
dev = [
    # 在隔离内存 Redis 中执行真实 Lua 脚本，测试限流原子性与过期行为。
    "fakeredis[lua]>=2.35,<3",
    "prometheus-client>=0.24,<1",
    # 可选任务模块的开发与类型检查依赖；部署按需安装运行时 extras。
    "celery[redis]>=5.5,<6",
    "celery-types>=0.23,<1",
    "httpx>=0.28,<0.29",
    "ruff>=0.15,<0.17",
    "pyright>=1.1.400,<2",
    "pytest>=9,<10",
    "pytest-asyncio>=1.3,<2",
    # PyJWT 注解引用可选 cryptography 类型；仅开发类型检查安装，HS256 运行时不需要。
    "pyjwt[crypto]>=2.10.1,<3",
    "coverage>=7.10,<8",
]

# 仅打包应用命名空间，避免把测试、运行数据和迁移目录误识别为包。
[tool.setuptools.packages.find]
include = ["app", "app.*"]
namespaces = false

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pyright]
include = ["app", "tests", "alembic"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers", "--import-mode=importlib"]
# 显式标注异步测试，每个测试使用独立事件循环，避免后续资源跨循环复用。
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"

[tool.coverage.run]
source = ["app"]
branch = true
relative_files = true

[tool.coverage.report]
fail_under = 80
show_missing = true
precision = 2
